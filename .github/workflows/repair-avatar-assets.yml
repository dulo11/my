name: Repair avatar animation assets
on:
  push:
    branches: [master]
    paths:
      - scripts/build_smooth_avatars.py
      - .github/workflows/repair-avatar-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate smooth animated avatars
        run: python scripts/build_smooth_avatars.py
      - name: Commit generated avatars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/img/avatar/*-smooth.webp
          if git diff --cached --quiet; then
            echo "No avatar changes"
            exit 0
          fi
          git commit -m "Build smoother 8-frame WebP avatars"
          git push
