<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星空管理后台</title><style>body{font:16px system-ui;background:#10162b;color:#f0f4ff;margin:0;padding:20px}main{max-width:850px;margin:auto}section,article{background:#202b47;border-radius:14px;padding:18px;margin:14px 0}input,button{font:inherit;padding:10px;margin:5px;border-radius:8px}input{max-width:90%}button{cursor:pointer}small{opacity:.7}article{overflow-wrap:anywhere}#notice{color:#ffce91}</style></head><body><main><h1>🌌 星空管理后台</h1><p><a href="/stars/" style="color:#a8d7ff">返回星空</a></p><p id="notice"></p><section id="setup" hidden><h2>首次设置管理员密码</h2><p>先在 Cloudflare 设置 STAR_ADMIN_TOKEN，再在此仅输入一次初始化密钥。</p><input id="token" type="password" placeholder="初始化密钥"><input id="initial" type="password" placeholder="新密码（至少12位）"><button id="init">创建管理员</button></section><section id="login" hidden><h2>管理员登录</h2><input id="password" type="password" placeholder="管理员密码"><button id="enter">登录（30天）</button></section><div id="panel" hidden><section><button id="refresh">刷新愿望列表</button><button id="logout">退出登录</button><h3>修改密码</h3><input id="old" type="password" placeholder="当前密码"><input id="new" type="password" placeholder="新密码（至少12位）"><button id="change">修改密码</button></section><div id="items"></div></div></main><script src="/js/yun-stars-admin.js"></script></body></html>
