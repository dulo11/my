<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星空空间 · 雲</title><link rel="stylesheet" href="/css/yun-extras.css"></head><body style="background:#0b112b"><main class="yun-app"><div class="yun-row"><a href="/">← 返回博客</a><a href="/tools/">在线工具箱</a></div><h1>🌌 星空空间</h1><p>独立互动空间，不会替换你喜欢的樱花首页。全站背景可用右下角 🎨 自由切换。</p><div class="yun-row"><button id="meteor">🌠 流星雨</button><button id="galaxy">🌌 银河</button><button id="clear">清除许愿星</button></div><div id="yun-stars-stage"><canvas id="sky"></canvas><div id="yun-stars-message">点击星空，让星星发光 ✨</div></div><div class="yun-row"><input id="wish" maxlength="100" placeholder="写下一个愿望（只保存在本机）"><button id="send">✨ 许愿星</button><button id="save">📷 保存星空图片</button></div><p id="wish-status" role="status"></p></main><script>
(()=>{const c=document.getElementById('sky'),ctx=c.getContext('2d'),box=c.parentElement;let w,h,stars=[],meteors=[],wishes=[];try{wishes=JSON.parse(localStorage.getItem('yun-wishes')||'[]')}catch{}function resize(){w=c.width=box.clientWidth;h=c.height=box.clientHeight;stars=Array.from({length:190},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.4,p:Math.random()*7}))}addEventListener('resize',resize);resize();let galaxy=false,t=0;function shoot(n){for(let i=0;i<n;i++)meteors.push({x:Math.random()*w,y:Math.random()*h*.5,v:4+Math.random()*5})}function draw(){requestAnimationFrame(draw);if(document.hidden)return;t++;ctx.clearRect(0,0,w,h);if(galaxy){let g=ctx.createRadialGradient(w*.5,h*.5,1,w*.5,h*.5,w*.6);g.addColorStop(0,'#795aaf44');g.addColorStop(1,'#0000');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}for(const s of stars){ctx.fillStyle='rgba(240,240,255,'+(.35+.6*Math.abs(Math.sin(t*.01+s.p)))+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}for(const m of meteors){ctx.strokeStyle='#cfe9ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-60,m.y-30);ctx.stroke();m.x+=m.v;m.y+=m.v*.5}meteors=meteors.filter(m=>m.x<w+80&&m.y<h+80);for(const a of wishes){ctx.fillStyle='#ffe5a1';ctx.font='20px sans-serif';ctx.fillText('✦',a.x*w,a.y*h)}}requestAnimationFrame(draw);box.onclick=e=>{const r=box.getBoundingClientRect();stars.push({x:e.clientX-r.left,y:e.clientY-r.top,r:3,p:1})};document.getElementById('meteor').onclick=()=>shoot(20);document.getElementById('galaxy').onclick=()=>galaxy=!galaxy;document.getElementById('send').onclick=()=>{const input=document.getElementById('wish'),s=input.value.trim();if(!s)return;wishes.push({text:s,x:.1+Math.random()*.8,y:.1+Math.random()*.75});localStorage.setItem('yun-wishes',JSON.stringify(wishes));document.getElementById('wish-status').textContent='愿望已保存在此浏览器，共 '+wishes.length+' 颗星';input.value=''};document.getElementById('clear').onclick=()=>{wishes=[];localStorage.removeItem('yun-wishes');document.getElementById('wish-status').textContent='已清除'};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='yun-stars.png';a.href=c.toDataURL('image/png');a.click()};box.addEventListener('pointerdown',e=>{const r=box.getBoundingClientRect();const x=(e.clientX-r.left)/w,y=(e.clientY-r.top)/h;const a=wishes.find(v=>Math.hypot(v.x-x,v.y-y)<.04);if(a)document.getElementById('wish-status').textContent=a.text});})();
</script></body></html>
