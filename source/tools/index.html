<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线工具箱 · 雲</title><link rel="stylesheet" href="/css/yun-extras.css"></head><body><main class="yun-app"><div class="yun-row"><a href="/">← 返回博客</a><a href="/stars/">🌌 星空</a><a href="/themes/">🎨 主题</a></div><h1>🧰 在线工具箱</h1><p>工具在浏览器本地运行。处理的文本、图片和文件不上传本站服务器。</p><div class="yun-row"><input id="search" placeholder="搜索工具名称"><select id="category"><option value="">全部分类</option><option>常用</option><option>文本</option><option>开发</option><option>图片</option><option>文件</option><option>趣味</option></select></div><div class="yun-row"><label><input type="checkbox" id="favorites-only">仅显示收藏</label><label><input type="checkbox" id="history-enabled">记录最近使用（仅工具名称）</label><button id="clear-history">清空使用记录</button></div><div id="recent-tools" class="yun-row"></div><div class="yun-tool-grid" id="grid"></div><section id="work" hidden><h2 id="tool-title"></h2><button id="favorite">收藏此工具</button><p id="tip"></p><div class="yun-row" id="fields"></div><textarea id="input" placeholder="在这里输入文本"></textarea><div class="yun-row"><button id="run">运行</button><button id="copy">复制结果</button><button id="result-input">结果作为下一步输入</button><button id="download">下载结果</button></div><pre id="result" aria-live="polite"></pre></section></main><script src="/js/yun-tools.js?v=20261025-2"></script><script src="/js/yun-themes.js?v=20261025-2"></script><script src="/js/sakura.js?v=20261025-2"></script></body></html>
