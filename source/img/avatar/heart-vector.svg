<circle cx="160" cy="160" r="142" fill="url(#orb)" stroke="#fbe3f6" stroke-width="5"/>
<circle cx="160" cy="160" r="138" fill="url(#inner)"/>
<g clip-path="url(#round)">
<ellipse cx="103" cy="65" rx="104" ry="40" transform="rotate(-30 103 65)" fill="#fff" opacity=".2" />
