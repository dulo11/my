<g fill="#fff" opacity=".83"><circle cx="93" cy="198" r="2.3"/><circle cx="234" cy="87" r="2.2"/><circle cx="198" cy="263" r="1.7"/><circle cx="113" cy="66" r="1.6"/></g>
</g>
