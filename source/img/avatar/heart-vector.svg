<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="雲博客粉紫动态头像">
<defs>
 <radialGradient id="orb" cx="37%" cy="27%" r="81%"><stop offset="0" stop-color="#eecded"/><stop offset=".28" stop-color="#c9afe7"/><stop offset=".69" stop-color="#a988d0"/><stop offset=".91" stop-color="#a890ce"/><stop offset="1" stop-color="#e8d0f1"/></radialGradient>
 <radialGradient id="inner" cx="48%" cy="45%" r="69%"><stop offset="0" stop-color="#a586d0" stop-opacity=".08"/><stop offset=".67" stop-color="#8561ae" stop-opacity=".12"/><stop offset="1" stop-color="#9061ac" stop-opacity=".43"/></radialGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffefc"/><stop offset=".36" stop-color="#f5d3fa"/><stop offset=".62" stop-color="#dba4ed"/><stop offset="1" stop-color="#ffedf6"/></linearGradient>
 <linearGradient id="crystal" x1="0" y1="0" x2=".83" y2="1"><stop offset="0" stop-color="#fff6ed"/><stop offset=".2" stop-color="#ffd6ef"/><stop offset=".42" stop-color="#f5a9f0"/><stop offset=".7" stop-color="#b783dd"/><stop offset="1" stop-color="#f8d5fc"/></linearGradient>
 <radialGradient id="petal"><stop offset="0" stop-color="#fff1f6"/><stop offset=".6" stop-color="#f6bfdf"/><stop offset="1" stop-color="#eba2d1"/></radialGradient>
 <radialGradient id="cloud" cx=".36" cy=".27"><stop offset="0" stop-color="#fffaff"/><stop offset=".65" stop-color="#f6e5fa"/><stop offset="1" stop-color="#dcbde9"/></radialGradient>
 <filter id="halo" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3"/></filter>
 <clipPath id="round"><circle cx="160" cy="160" r="140"/></clipPath>
 <style>
 .spark{transform-box:fill-box;transform-origin:center;animation:blink 5.8s ease-in-out infinite alternate}
 .spark:nth-of-type(2n){animation-delay:-2.7s}
 .orbit{animation:orbreathe 7s ease-in-out infinite alternate;transform-origin:160px 160px}
 .petal{animation:petalfade 7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
 @keyframes blink{0%{opacity:.5;transform:scale(.9)}45%{opacity:1;transform:scale(1.04)}100%{opacity:.58;transform:scale(.92)}}
 @keyframes orbreathe{0%{opacity:.46;transform:rotate(-1.5deg)}100%{opacity:.85;transform:rotate(1.5deg)}}
 @keyframes petalfade{0%{opacity:.74;transform:translate(0,0)}100%{opacity:1;transform:translate(2px,-3px)}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
</defs>
