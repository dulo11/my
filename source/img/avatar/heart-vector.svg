<ellipse cx="160" cy="173" rx="112" ry="32" transform="rotate(-24 160 173)" fill="none" stroke="#fff" stroke-width=".7" opacity=".72"/></g>
<g><path d="M160 153c-35-24-59-45-58-74 1-24 23-42 46-37 13 3 18 10 24 19 10-13 24-19 39-15 20 5 34 23 32 43-2 29-40 55-83 83Z" fill="url(#crystal)" stroke="#fff0fa" stroke-width="4"/>
<path d="M126 60Q149 48 166 76" fill="none" stroke="#fffaff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
<g fill="url(#cloud)" stroke="#f5dcf8" stroke-width="2"><ellipse cx="165" cy="218" rx="83" ry="26"/><circle cx="128" cy="198" r="30"/><circle cx="161" cy="192" r="43"/><circle cx="202" cy="203" r="28"/></g>
<path d="M92 225q62 20 130-3" fill="none" stroke="#fffafc" stroke-width="2.8" opacity=".62"/></g>
<g class="petal" fill="url(#petal)" stroke="#ffebfb" stroke-width="1">
<path d="M251 54q17-9 20 5t-13 17q-15-3-7-22Z" transform="rotate(-8 251 54)"/>
