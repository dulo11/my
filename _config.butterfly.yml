# 公告（右侧“公告”卡片）
aside:
  card_announcement:
    enable: true
    content: |
      日常

  card_author:
    enable: true
    button:
      enable: true
      icon: fab fa-telegram-plane
      text: 联系我
      link: https://t.me/NoFly_bot

# 顶部大图（你想换右边那条大背景就改它）
index_img: /img/tu1.jpg
default_top_img: /img/tu1.jpg

# 页面底色（不想要花里胡哨就用淡色）
background:
  enable: true
  background: url(/img/tu1.jpg)
  position: center center
  repeat: no-repeat
  size: cover
  attachment: fixed
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/sakura.js"></script>
footer:
  owner:
    enable: true
    since: 2026
  custom_text: '© 2026 why | 记录 <br>
  <a href=" " target="_blank">站点</a > |
  <a href="mailto:99@966405.xyz">邮箱</a >'
  copyright: true
social:
  Telegram: https://t.me/NoFly_bot || fab fa-telegram-plane

# 首页欢迎语
subtitle:
  enable: true
  effect: true
  loop: true
  source: false
  sub:
  - "云起时相逢，风过处相念。"
  - "English: We meet when clouds rise, and miss each other when the wind passes."
  - "日本語：雲が立つ時に出会い、風が過ぎる所で想い合う。"
  - "Tiếng Việt: Ta gặp nhau khi mây nổi, và nhớ nhau khi gió qua."
  - "ไทย: เราพบกันยามเมฆลอยขึ้น และคิดถึงกันยามสายลมพัดผ่าน"
  - "Bahasa Melayu: Kita bertemu saat awan berarak, dan saling merindu ketika angin berlalu."
  - "Filipino: Nagtagpo tayo nang umangat ang mga ulap, at nangulila sa isa’t isa nang dumaan ang hangin."
  - "한국어：구름이 피어날 때 만나고, 바람이 스칠 때 서로를 그리워한다."
  - "Français : Nous nous rencontrons quand les nuages se lèvent, et nous pensons l’un à l’autre quand le vent passe."
  - "Deutsch: Wir begegnen uns, wenn die Wolken aufsteigen, und denken aneinander, wenn der Wind vorüberzieht."
  - "Español: Nos encontramos cuando las nubes se alzan, y nos recordamos cuando pasa el viento."
  - "Português: Encontramo-nos quando as nuvens se erguem, e sentimos saudade quando o vento passa."
  - "Русский: Мы встречаемся, когда поднимаются облака, и вспоминаем друг друга, когда проходит ветер."
  - "العربية: نلتقي حين تنهض الغيوم، ونشتاق حين يمرّ النسيم."
